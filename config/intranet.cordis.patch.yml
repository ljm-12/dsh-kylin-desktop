# Kylin desktop deployment policy: local model configuration stays editable in
# Settings > Models while public provider, search, feedback, and telemetry rows
# remain unavailable.
- id: agent-default-model
  config:
    provider: intranet-openai
    model: DeepSeek-V4-Flash-0731-w4a8

- id: llm-pi-ai
  config:
    providers:
      intranet-openai:
        displayName: 内网 OpenAI 兼容服务
        apiKeyEnv: INTRANET_OPENAI_API_KEY
        api: openai-completions
        baseURL: http://192.168.0.40:3000/v1
        models:
          - id: DeepSeek-V4-Flash-0731-w4a8
            name: DeepSeek-V4-Flash-0731-w4a8
            contextWindow: 131072
            maxTokens: 8192
          - id: local-model
            name: local-model
            contextWindow: 131072
            maxTokens: 8192

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- id: command-feedback
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-title-llm
  disabled: true

# Schedule is provided by the official optional
# @deepseek-ai/dsh-experimental-schedule-bundle plugin. Enable that bundle
# through the official plugin manager instead of duplicating its rows here.
